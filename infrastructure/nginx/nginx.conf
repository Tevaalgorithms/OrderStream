# ============================================================
# Nginx — Local API Gateway Simulation
#
# CONCEPT: API Gateway Pattern
# A single entry point (port 8000) routes all client requests
# to the correct downstream microservice based on URL path.
#
# In production: Replace this with AWS API Gateway with:
#   - JWT Authorizer (validates Bearer tokens)
#   - Rate limiting per client IP / API key
#   - Request/response transformation
#   - Usage plans and throttling
# ============================================================

events {
    worker_connections 1024;
}

http {
    # Upstream definitions — each microservice
    upstream order_service       { server order-service:8001; }
    upstream inventory_service   { server inventory-service:8002; }
    upstream payment_service     { server payment-service:8003; }
    upstream notification_service { server notification-service:8004; }
    upstream analytics_service   { server analytics-service:8005; }

    server {
        listen 8000;
        server_name localhost;

        # ── Order Service ──
        # Handles: POST /orders, GET /orders/{id}
        location /orders {
            proxy_pass         http://order_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Inventory Service ──
        # Handles: GET /products, POST /products, GET /inventory/check
        location /products {
            proxy_pass         http://inventory_service;
            proxy_set_header   Host $host;
        }
        location /inventory {
            proxy_pass         http://inventory_service;
            proxy_set_header   Host $host;
        }

        # ── Payment Service ──
        # Handles: GET /payments/{order_id}, POST /payments/{order_id}/retry
        location /payments {
            proxy_pass         http://payment_service;
            proxy_set_header   Host $host;
        }

        # ── Notification Service ──
        location /notifications {
            proxy_pass         http://notification_service;
            proxy_set_header   Host $host;
        }

        # ── Analytics Service ──
        # Handles: GET /analytics/orders/summary, GET /analytics/products/top
        location /analytics {
            proxy_pass         http://analytics_service;
            proxy_set_header   Host $host;
        }

        # Health check endpoint for the gateway itself
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
